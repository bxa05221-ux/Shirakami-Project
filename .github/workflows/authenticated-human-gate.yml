name: Shirakami Authenticated Human Gate Chain

on:
  push:
    paths:
      - "runtime/authenticated_human_gate.py"
      - "scripts/test_authenticated_human_gate.py"
      - "docs/AUTHENTICATED_HUMAN_GATE_CHAIN_SPECIFICATION.md"
      - ".github/workflows/authenticated-human-gate.yml"
  pull_request:
    paths:
      - "runtime/authenticated_human_gate.py"
      - "scripts/test_authenticated_human_gate.py"
      - "docs/AUTHENTICATED_HUMAN_GATE_CHAIN_SPECIFICATION.md"
      - ".github/workflows/authenticated-human-gate.yml"

jobs:
  authenticated-human-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest -q scripts/test_authenticated_human_gate.py
