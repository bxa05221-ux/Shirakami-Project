name: Shirakami API Boundary

on:
  push:
    paths:
      - "api/**"
      - "runtime/**"
      - "scripts/test_http_api.py"
      - ".github/workflows/shirakami-api.yml"
  pull_request:
    paths:
      - "api/**"
      - "runtime/**"
      - "scripts/test_http_api.py"
      - ".github/workflows/shirakami-api.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run API boundary tests
        run: python -m pytest -q scripts/test_http_api.py scripts/test_validate_api_boundary.py
