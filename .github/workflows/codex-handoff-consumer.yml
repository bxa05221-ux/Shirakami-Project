name: Codex Handoff Consumer Verification

on:
  push:
    paths:
      - "handoff/**"
      - "scripts/**"
      - "api/**"
      - "aiwitness/**"
      - ".github/workflows/codex-handoff-consumer.yml"
  pull_request:
    paths:
      - "handoff/**"
      - "scripts/**"
      - "api/**"
      - "aiwitness/**"
      - ".github/workflows/codex-handoff-consumer.yml"

jobs:
  consume-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML
      - name: Consume Semantic Handoff
        run: python scripts/consume_handoff.py handoff/SH-HO-20260925-001.yaml
      - name: Verify consumer
        run: pytest -q scripts/test_consume_handoff.py
      - name: Verify Codex result contract
        run: pytest -q scripts/test_validate_codex_result.py
      - name: Verify Codex result return path
        run: pytest -q scripts/test_record_codex_result.py
      - name: Verify Semantic Handoff trace recorder
        run: pytest -q scripts/test_record_codex_trace.py
      - name: Verify Codex trace commit binding
        run: pytest -q scripts/test_bind_codex_trace.py
      - name: Verify Codex result trace closure
        run: pytest -q scripts/test_merge_codex_result_into_trace.py
      - name: Verify AIwitness trace projection
        run: pytest -q scripts/test_record_aiwitness.py
      - name: Verify trace to API context bridge
        run: pytest -q scripts/test_build_api_context.py
      - name: Verify runtime adapter boundary
        run: pytest -q scripts/test_build_runtime_request.py
      - name: Verify provider adapter boundary
        run: pytest -q scripts/test_provider_adapter.py
      - name: Verify Protocol RuntimeRequest execution boundary
        run: pytest -q scripts/test_execute_runtime_request.py
      - name: Verify EvidenceRecord boundary
        run: pytest -q scripts/test_build_evidence_record.py
      - name: Verify EvidenceRecord to AIwitness projection
        run: pytest -q scripts/test_project_evidence_to_aiwitness.py
      - name: Verify Evidence to Semantic Handoff evolution loop
        run: pytest -q scripts/test_build_evolution_handoff.py
      - name: Verify Candidate structural validation and Human Gate
        run: pytest -q scripts/test_build_candidate.py
      - name: Verify human approval to Protocol boundary
        run: pytest -q scripts/test_build_protocol.py
      - name: Verify Protocol to RuntimeRequest boundary
        run: pytest -q scripts/test_build_protocol_runtime_request.py
      - name: Verify API boundary contract
        run: pytest -q scripts/test_validate_api_boundary.py
      - name: Verify AIwitness boundary contract
        run: pytest -q scripts/test_validate_aiwitness_boundary.py
