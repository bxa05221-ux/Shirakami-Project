name: Codex Handoff Consumer Verification

on:
  push:
    paths: ["handoff/**","scripts/**","api/**","aiwitness/**","runtime/**",".github/workflows/codex-handoff-consumer.yml"]
  pull_request:
    paths: ["handoff/**","scripts/**","api/**","aiwitness/**","runtime/**",".github/workflows/codex-handoff-consumer.yml"]

jobs:
  consume-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML
      - name: Consume Semantic Handoff
        run: python scripts/consume_handoff.py handoff/SH-HO-20260925-001.yaml
      - name: Verify consumer
        run: pytest -q scripts/test_consume_handoff.py
      - name: Verify Codex result contract
        run: pytest -q scripts/test_validate_codex_result.py
      - name: Verify Codex result return path
        run: pytest -q scripts/test_record_codex_result.py
      - name: Verify Semantic Handoff trace recorder
        run: pytest -q scripts/test_record_codex_trace.py
      - name: Verify Codex trace commit binding
        run: pytest -q scripts/test_bind_codex_trace.py
      - name: Verify Codex result trace closure
        run: pytest -q scripts/test_merge_codex_result_into_trace.py
      - name: Verify AIwitness trace projection
        run: pytest -q scripts/test_record_aiwitness.py
      - name: Verify trace to API context bridge
        run: pytest -q scripts/test_build_api_context.py
      - name: Verify Semantic Handoff lineage boundary
        run: pytest -q scripts/test_semantic_handoff.py scripts/test_api_semantic_handoff.py
      - name: Verify Evidence ID lineage through Handoff and AIwitness
        run: pytest -q scripts/test_semantic_handoff_evidence_lineage.py
      - name: Verify runtime adapter boundary
        run: pytest -q scripts/test_build_runtime_request.py
      - name: Verify provider adapter boundary
        run: pytest -q scripts/test_provider_adapter.py
      - name: Verify Protocol RuntimeRequest execution boundary
        run: pytest -q scripts/test_execute_runtime_request.py
      - name: Verify EvidenceRecord boundary
        run: pytest -q scripts/test_build_evidence_record.py
      - name: Verify EvidenceRecord to AIwitness projection
        run: pytest -q scripts/test_project_evidence_to_aiwitness.py
      - name: Verify Evidence to Semantic Handoff evolution loop
        run: pytest -q scripts/test_build_evolution_handoff.py
      - name: Verify Candidate structural validation and Human Gate
        run: pytest -q scripts/test_build_candidate.py
      - name: Verify human approval to Protocol boundary
        run: pytest -q scripts/test_build_protocol.py
      - name: Verify Protocol to RuntimeRequest boundary
        run: pytest -q scripts/test_build_protocol_runtime_request.py
      - name: Verify API boundary contract
        run: pytest -q scripts/test_validate_api_boundary.py
      - name: Verify AIwitness boundary contract
        run: pytest -q scripts/test_validate_aiwitness_boundary.py
      - name: Verify Semantic Integrity boundary
        run: pytest -q scripts/test_semantic_integrity.py
      - name: Verify Context Transition history boundary
        run: pytest -q scripts/test_context_transition.py
      - name: Verify re-observation queue boundary
        run: pytest -q scripts/test_reobservation.py
      - name: Verify re-observation lineage boundary
        run: pytest -q scripts/test_reobservation_lineage.py
      - name: Verify Conflict / Deadman / Life boundary
        run: pytest -q scripts/test_conflict_boundary.py
      - name: Verify Symbolic Recursion / Context boundary
        run: pytest -q scripts/test_symbolic_recursion.py
      - name: Verify Symbolic Recursion → Context Transition bridge
        run: pytest -q scripts/test_symbolic_context_bridge.py
      - name: Verify Symbolic Recursion → Re-observation lineage
        run: pytest -q scripts/test_symbolic_reobservation.py
      - name: Verify Symbolic Interpretation / Evidence boundary
        run: pytest -q scripts/test_symbolic_evidence_boundary.py
      - name: Verify Symbolic provenance projection
        run: pytest -q scripts/test_project_symbolic_provenance.py
      - name: Verify Symbolic Human Gate decision boundary
        run: pytest -q scripts/test_symbolic_decision_boundary.py
      - name: Verify Symbolic Human Gate contract
        run: pytest -q scripts/test_symbolic_human_gate_contract.py
      - name: Verify Phase 5 symbolic boundary roadmap
        run: pytest -q scripts/test_phase5_symbolic_boundary_roadmap.py
      - name: Verify Phase 5 Human Gate note
        run: pytest -q scripts/test_symbolic_human_gate_note.py
      - name: Verify Phase 5 Human Gate summary
        run: pytest -q scripts/test_symbolic_human_gate_summary.py
      - name: Verify Phase 5 Human Gate final checkpoint
        run: pytest -q scripts/test_symbolic_human_gate_final.py
      - name: Verify Phase 5 Human Gate PR checkpoint
        run: pytest -q scripts/test_symbolic_human_gate_pr.py
      - name: Verify Human Gate → Protocol boundary
        run: pytest -q scripts/test_human_gate_protocol.py
      - name: Verify Human-approved Protocol → RuntimeRequest
        run: pytest -q scripts/test_human_approved_runtime_request.py
      - name: Verify RuntimeRequest → ExecutionTrace approval lineage
        run: pytest -q scripts/test_runtime_execution_trace.py
      - name: Verify ExecutionTrace → AIwitness projection
        run: pytest -q scripts/test_execution_aiwitness_bridge.py
      - name: Verify AIwitness → Observation return path
        run: pytest -q scripts/test_aiwitness_observation_bridge.py
      - name: Verify Observation → Evidence candidate boundary
        run: pytest -q scripts/test_observation_evidence_candidate.py
      - name: Verify Observation → Evidence structural validation
        run: pytest -q scripts/test_observation_evidence_validation.py
