name: Shirakami UI Adapter Human Gate Boundary

on:
  push:
    paths:
      - "runtime/ui_adapter_gate.py"
      - "scripts/test_ui_adapter_gate.py"
      - "docs/UI_ADAPTER_HUMAN_GATE_SPECIFICATION.md"
      - ".github/workflows/ui-adapter-human-gate.yml"
  pull_request:
    paths:
      - "runtime/ui_adapter_gate.py"
      - "scripts/test_ui_adapter_gate.py"
      - "docs/UI_ADAPTER_HUMAN_GATE_SPECIFICATION.md"
      - ".github/workflows/ui-adapter-human-gate.yml"

jobs:
  ui-adapter-human-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest -q scripts/test_ui_adapter_gate.py
