name: AIwitness Decision Map Conformance

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  aiwitness-decision-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml pytest
      - run: python scripts/validate_aiwitness_boundary.py
      - run: pytest -q scripts/test_record_aiwitness.py scripts/test_validate_aiwitness_boundary.py
