name: Human Gate Strategic Profile

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  strategic-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run strategic Human Gate profile tests
        run: python scripts/test_human_gate_profile.py
