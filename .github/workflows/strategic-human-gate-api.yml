name: Strategic Human Gate API

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  strategic-human-gate-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run API extension tests
        run: python -m scripts.test_human_gate_http_api
