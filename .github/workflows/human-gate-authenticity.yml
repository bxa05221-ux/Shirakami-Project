name: Shirakami Human Gate Authenticity Boundary

on:
  push:
    paths:
      - "runtime/human_gate_authenticity.py"
      - "scripts/test_human_gate_authenticity.py"
      - "docs/HUMAN_GATE_AUTHENTICITY_SPECIFICATION.md"
      - ".github/workflows/human-gate-authenticity.yml"
  pull_request:
    paths:
      - "runtime/human_gate_authenticity.py"
      - "scripts/test_human_gate_authenticity.py"
      - "docs/HUMAN_GATE_AUTHENTICITY_SPECIFICATION.md"
      - ".github/workflows/human-gate-authenticity.yml"

jobs:
  human-gate-authenticity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest -q scripts/test_human_gate_authenticity.py
