name: Shirakami Trust Root Temporal

on:
  push:
    paths:
      - "runtime/trust_root_temporal.py"
      - "scripts/test_trust_root_temporal.py"
      - "docs/TRUST_ROOT_TEMPORAL_SPECIFICATION.md"
      - ".github/workflows/trust-root-temporal.yml"
  pull_request:
    paths:
      - "runtime/trust_root_temporal.py"
      - "scripts/test_trust_root_temporal.py"
      - "docs/TRUST_ROOT_TEMPORAL_SPECIFICATION.md"
      - ".github/workflows/trust-root-temporal.yml"

jobs:
  trust-root-temporal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest scripts/test_trust_root_temporal.py
