name: Shirakami Temporal Authority

on:
  push:
    paths:
      - "runtime/temporal_integrity.py"
      - "scripts/test_temporal_integrity.py"
      - "docs/TEMPORAL_AUTHORITY_ATTACK_SPECIFICATION.md"
      - ".github/workflows/temporal-authority.yml"
  pull_request:
    paths:
      - "runtime/temporal_integrity.py"
      - "scripts/test_temporal_integrity.py"
      - "docs/TEMPORAL_AUTHORITY_ATTACK_SPECIFICATION.md"
      - ".github/workflows/temporal-authority.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run temporal authority tests
        run: pytest -q scripts/test_temporal_integrity.py
