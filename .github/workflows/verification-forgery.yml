name: Shirakami Verification Forgery Resistance

on:
  push:
    paths:
      - "runtime/verification_forgery.py"
      - "scripts/test_verification_forgery.py"
      - "docs/VERIFICATION_FORGERY_RESISTANCE_SPECIFICATION.md"
      - ".github/workflows/verification-forgery.yml"
  pull_request:
    paths:
      - "runtime/verification_forgery.py"
      - "scripts/test_verification_forgery.py"
      - "docs/VERIFICATION_FORGERY_RESISTANCE_SPECIFICATION.md"
      - ".github/workflows/verification-forgery.yml"

jobs:
  verification-forgery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest scripts/test_verification_forgery.py
