name: Shirakami Quorum Decision Recovery Boundary

on:
  push:
    paths:
      - "runtime/quorum_decision_recovery.py"
      - "scripts/test_quorum_decision_recovery.py"
      - "docs/QUORUM_DECISION_RECOVERY_SPECIFICATION.md"
      - ".github/workflows/quorum-decision-recovery.yml"
  pull_request:
    paths:
      - "runtime/quorum_decision_recovery.py"
      - "scripts/test_quorum_decision_recovery.py"
      - "docs/QUORUM_DECISION_RECOVERY_SPECIFICATION.md"
      - ".github/workflows/quorum-decision-recovery.yml"

jobs:
  quorum-decision-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest -q scripts/test_quorum_decision_recovery.py
