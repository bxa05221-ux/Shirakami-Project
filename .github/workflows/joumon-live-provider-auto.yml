name: JOUMON Live Provider Observation (Auto Model)

on:
  workflow_dispatch:
    inputs:
      statement:
        description: 'Observation statement'
        required: true
        type: string
  push:
    paths:
      - ".github/joumon-live-trigger.txt"

jobs:
  live-observation:
    runs-on: ubuntu-latest
    environment: joumon-live
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip openai pyyaml
      - name: Read observation statement
        id: statement
        shell: bash
        run: |
          if [ -n "${{ inputs.statement }}" ]; then
            printf '%s' "${{ inputs.statement }}" > /tmp/joumon_statement.txt
          else
            cp .github/joumon-live-trigger.txt /tmp/joumon_statement.txt
          fi
      - name: Discover model and run live JOUMON observation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JOUMON_STATEMENT_FILE: /tmp/joumon_statement.txt
        run: python examples/joumon-minimal/openai_live_discovery_entrypoint.py
