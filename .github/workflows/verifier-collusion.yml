name: Shirakami Verifier Collusion Resistance

on:
  push:
    paths:
      - "runtime/verifier_collusion.py"
      - "scripts/test_verifier_collusion.py"
      - "docs/VERIFIER_COLLUSION_RESISTANCE_SPECIFICATION.md"
      - ".github/workflows/verifier-collusion.yml"
  pull_request:
    paths:
      - "runtime/verifier_collusion.py"
      - "scripts/test_verifier_collusion.py"
      - "docs/VERIFIER_COLLUSION_RESISTANCE_SPECIFICATION.md"
      - ".github/workflows/verifier-collusion.yml"

jobs:
  verifier-collusion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest -q scripts/test_verifier_collusion.py
