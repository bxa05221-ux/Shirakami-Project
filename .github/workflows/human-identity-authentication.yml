name: Shirakami Human Identity Authentication Boundary

on:
  push:
    paths:
      - "runtime/human_identity_auth.py"
      - "scripts/test_human_identity_auth.py"
      - "docs/HUMAN_IDENTITY_AUTHENTICATION_SPECIFICATION.md"
      - ".github/workflows/human-identity-authentication.yml"
  pull_request:
    paths:
      - "runtime/human_identity_auth.py"
      - "scripts/test_human_identity_auth.py"
      - "docs/HUMAN_IDENTITY_AUTHENTICATION_SPECIFICATION.md"
      - ".github/workflows/human-identity-authentication.yml"

jobs:
  human-identity-authentication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest -q scripts/test_human_identity_auth.py
