name: Shirakami Core Conformance

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  core-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: python scripts/run_core_conformance.py
