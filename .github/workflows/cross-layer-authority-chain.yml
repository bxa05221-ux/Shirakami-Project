name: Shirakami Cross-Layer Authority Chain

on:
  push:
    paths:
      - "runtime/cross_layer_authority_chain.py"
      - "scripts/test_cross_layer_authority_chain.py"
      - ".github/workflows/cross-layer-authority-chain.yml"
  pull_request:
    paths:
      - "runtime/cross_layer_authority_chain.py"
      - "scripts/test_cross_layer_authority_chain.py"
      - ".github/workflows/cross-layer-authority-chain.yml"

jobs:
  cross-layer-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest -q scripts/test_cross_layer_authority_chain.py
