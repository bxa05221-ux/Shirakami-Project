name: Shirakami Full Human Gate Chain
on:
  push:
    paths:
      - "runtime/full_human_gate.py"
      - "runtime/ui_adapter_gate.py"
      - "runtime/human_decision_replay.py"
      - "runtime/decision_binding.py"
      - "runtime/authenticated_human_gate.py"
      - "scripts/test_full_human_gate.py"
      - "docs/FULL_HUMAN_GATE_CHAIN_SPECIFICATION.md"
      - ".github/workflows/full-human-gate.yml"
  pull_request:
    paths:
      - "runtime/full_human_gate.py"
      - "runtime/ui_adapter_gate.py"
      - "runtime/human_decision_replay.py"
      - "runtime/decision_binding.py"
      - "runtime/authenticated_human_gate.py"
      - "scripts/test_full_human_gate.py"
      - "docs/FULL_HUMAN_GATE_CHAIN_SPECIFICATION.md"
      - ".github/workflows/full-human-gate.yml"
jobs:
  full-human-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest -q scripts/test_full_human_gate.py
