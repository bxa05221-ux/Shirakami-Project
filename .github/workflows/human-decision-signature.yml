name: Shirakami Human Decision Signature Boundary

on:
  push:
    paths:
      - "runtime/human_decision_signature.py"
      - "scripts/test_human_decision_signature.py"
      - "docs/HUMAN_DECISION_SIGNATURE_SPECIFICATION.md"
      - ".github/workflows/human-decision-signature.yml"
  pull_request:
    paths:
      - "runtime/human_decision_signature.py"
      - "scripts/test_human_decision_signature.py"
      - "docs/HUMAN_DECISION_SIGNATURE_SPECIFICATION.md"
      - ".github/workflows/human-decision-signature.yml"

jobs:
  human-decision-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest -q scripts/test_human_decision_signature.py
