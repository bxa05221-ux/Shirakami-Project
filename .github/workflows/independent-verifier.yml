name: Shirakami Independent Verifier Boundary

on:
  push:
    paths:
      - "runtime/independent_verifier.py"
      - "scripts/test_independent_verifier.py"
      - "docs/INDEPENDENT_VERIFIER_SPECIFICATION.md"
      - ".github/workflows/independent-verifier.yml"
  pull_request:
    paths:
      - "runtime/independent_verifier.py"
      - "scripts/test_independent_verifier.py"
      - "docs/INDEPENDENT_VERIFIER_SPECIFICATION.md"
      - ".github/workflows/independent-verifier.yml"

jobs:
  independent-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest -q scripts/test_independent_verifier.py
