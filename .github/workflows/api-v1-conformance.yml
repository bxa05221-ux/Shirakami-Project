name: Shirakami API v1.0 Conformance

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  api-v1-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest pyyaml
      - run: python scripts/run_api_conformance.py
