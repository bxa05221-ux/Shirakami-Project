name: Shirakami Authenticated Human Gate Chaos

on:
  push:
    paths:
      - "scripts/test_authenticated_human_gate_chaos.py"
      - "docs/AUTHENTICATED_HUMAN_GATE_CHAOS_SPECIFICATION.md"
      - ".github/workflows/authenticated-human-gate-chaos.yml"
  pull_request:
    paths:
      - "scripts/test_authenticated_human_gate_chaos.py"
      - "docs/AUTHENTICATED_HUMAN_GATE_CHAOS_SPECIFICATION.md"
      - ".github/workflows/authenticated-human-gate-chaos.yml"

jobs:
  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest -q scripts/test_authenticated_human_gate_chaos.py
